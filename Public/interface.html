<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linksphere - Interface</title>
  <link rel="stylesheet" href="interface.css" />
</head>
<body>

  <header class="topbar">
    <div class="left-header">
      <button class="menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand">
        <div class="brand-icon">✣</div>
        <h1>LINKSPHERE</h1>
      </div>
    </div>

    <button class="profile-btn">
      <img src="profile.jpg" alt="Profile" />
    </button>
  </header>

  <main class="page">
    <section class="hero reveal">
      <span class="tag">NEW CONNECTION</span>

      <h2>
        WELCOME TO <br />
        <strong>LINKSPHERE.</strong><br />
        LET'S GET STARTED.
      </h2>

      <div class="underline"></div>
    </section>

    <section class="cards">
      <button class="action-card reveal">
        <div class="card-icon">+</div>

        <h3>Create a<br />Workspace</h3>
        <p>Already have a team? Enter an invite code to jump right into the action.</p>

        <span class="join-link">
          Join Now →
        </span>
      </button>

      <button class="action-card reveal">
        <div class="card-icon">+</div>

        <h3>Join a<br />Workspace</h3>
        <p>Already have a team? Enter an invite code to jump right into the action.</p>

        <span class="join-link">
          Join Now →
        </span>
      </button>
    </section>

    <section class="features reveal">
      <div class="feature">
        <span>✦</span>
        <p>High Performance Hubs</p>
      </div>

      <div class="feature">
        <span>⬟</span>
        <p>Enterprise Security</p>
      </div>

      <div class="feature">
        <span>ϟ</span>
        <p>Real-Time Sync</p>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="#">
      <span>⌂</span>
      Start
    </a>

    <a href="#">
      <span>◉</span>
      Search
    </a>

    <a href="#">
      <span>♢</span>
      Notification
    </a>

    <a href="#">
      <span>▦</span>
      Workspace
    </a>
  </nav>

  <script src="interface.js"></script>
</body>
</html>
